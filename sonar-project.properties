# Project identity
sonar.projectKey=cohort-9-mern-15099-tahira
sonar.projectName=Notes App MERN
sonar.sourceEncoding=UTF-8

# Analyze the backend and frontend together as one project.
sonar.sources=backend,frontend
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.test.js,frontend/src/**/*.test.jsx

# Do not analyze dependencies, generated outputs, test sources, or static assets.
sonar.exclusions=**/node_modules/**,**/coverage/**,frontend/dist/**,frontend/public/**,backend/tests/**,frontend/src/**/*.test.jsx,frontend/__mocks__/**
sonar.cpd.exclusions=backend/tests/**,frontend/src/**/*.test.jsx

# LCOV reports are created by npm run test:coverage at the repository root.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
